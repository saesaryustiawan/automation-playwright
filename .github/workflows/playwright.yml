name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Chromium smoke tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://www.saucedemo.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npm run typecheck
      - name: Run smoke tests
        run: npm run test:smoke -- --project=chromium
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium-smoke
          path: playwright-report/
          retention-days: 14
      - name: Upload failure artifacts
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-chromium-smoke
          path: test-results/
          retention-days: 14

  regression:
    name: ${{ matrix.project }} regression tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      BASE_URL: https://www.saucedemo.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Type check
        run: npm run typecheck
      - name: Run regression tests
        run: npm run test:regression -- --project=${{ matrix.project }}
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-regression
          path: playwright-report/
          retention-days: 14
      - name: Upload failure artifacts
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}-regression
          path: test-results/
          retention-days: 14
